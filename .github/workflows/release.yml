name: Build & Release Extension

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Extract version
        id: get_version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./manifest.json').version")
            echo "VERSION=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Package extension
        id: package
        run: |
          ZIP_NAME="autolike-extension-${{ steps.get_version.outputs.VERSION }}.zip"
          zip -r "$ZIP_NAME" manifest.json content.js popup.html popup.css popup.js icons/ LICENSE README.md SECURITY.md
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_OUTPUT

      - name: Upload zip to GitHub Release
        uses: softprops/action-gh-release@v3
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: ${{ steps.package.outputs.ZIP_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
