<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoLike Dashboard</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <img src="icons/icon48.png" alt="AutoLike" class="logo">
        <div class="brand-text">
          <h1>AutoLike</h1>
          <span class="tagline" id="tagline">Auto-like after 25% watched</span>
        </div>
      </div>
      <div class="header-actions">
        <button id="open-tab-btn" class="icon-btn" title="Open Full Dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
            <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
            <polyline points="15 3 21 3 21 9"/>
            <line x1="10" y1="14" x2="21" y2="3"/>
          </svg>
        </button>
        <label class="toggle" id="toggle-label">
          <input type="checkbox" id="toggle-switch">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </header>

    <div class="divider"></div>

    <div class="dashboard">
      <div class="dashboard-left">
        <div class="stats" id="stats">
          <svg class="stats-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/>
            <path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
          </svg>
          <span id="stats-count">0 videos auto-liked</span>
        </div>

        <div class="divider"></div>

        <div class="now-watching" id="now-watching">
          <h2>Now Watching</h2>
          <div class="now-watching-card" id="now-watching-card">
            <div class="now-watching-empty" id="now-watching-empty">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
              </svg>
              No video being tracked
            </div>
            <div class="now-watching-info" id="now-watching-info" style="display:none;">
              <span class="now-watching-title" id="now-watching-title"></span>
              <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progress-bar-fill"></div>
              </div>
              <div class="progress-meta">
                <span class="progress-text" id="progress-text">0%</span>
                <span class="progress-time" id="progress-time">0s / 0s</span>
              </div>
            </div>
            <div class="now-watching-liked" id="now-watching-liked" style="display:none;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/>
                <path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
              </svg>
              <span id="now-watching-liked-title"></span>
            </div>
            <div class="now-watching-skipped" id="now-watching-skipped" style="display:none;">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                <path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.72a2 2 0 0 0-2 1.7l-1.38 9a2 2 0 0 0 2 2.3H10z"/>
                <path d="M17 2h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/>
              </svg>
              <span id="now-watching-skipped-title"></span>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="settings">
          <h2>Settings</h2>
          <div class="setting-row">
            <label for="min-duration">Min video length</label>
            <div class="setting-input">
              <input type="number" id="min-duration" min="0" max="120" step="1" value="2" placeholder="2">
              <span class="setting-unit">min</span>
            </div>
          </div>
          <div class="setting-row">
            <label for="watch-percent">Watch threshold</label>
            <div class="setting-input">
              <input type="number" id="watch-percent" min="1" max="100" step="1" value="25" placeholder="25">
              <span class="setting-unit">%</span>
            </div>
          </div>
          <div class="setting-row">
            <label for="record-history-toggle">Record Like History</label>
            <label class="toggle" id="record-history-label">
              <input type="checkbox" id="record-history-toggle" checked>
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>
      </div>

      <div class="dashboard-right">
        <div class="activity" id="activity-section">
          <h2>Recent Activity</h2>
          <ul id="activity-list" class="activity-list">
            <li class="empty-state">No videos auto-liked yet</li>
          </ul>
          <button id="view-all-btn" class="view-all-btn" style="display:none;">View All History</button>
        </div>

        <div id="history-panel" class="history-panel">
          <div class="history-header">
            <button id="history-back" class="history-back" title="Back">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
              </svg>
            </button>
            <h2>All Auto-Liked Videos</h2>
            <button id="clear-history" class="clear-history-btn">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
              Clear
            </button>
          </div>
          <div class="history-search-container">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" class="search-icon">
              <circle cx="11" cy="11" r="8"/>
              <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <input type="text" id="history-search" class="history-search" placeholder="Search liked videos...">
          </div>
          <ul id="history-list" class="history-list"></ul>
          <button id="history-open-tab" class="view-all-btn full-tab-only-hide" style="margin-top: 10px;">Open Full Dashboard</button>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
